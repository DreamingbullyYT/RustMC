name: Import Horizon-Android

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    if: github.event_name == 'push' && github.event.head_commit.message == 'chore: import Horizon-Android source into main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected Android source
        uses: actions/checkout@v4
        with:
          repository: GoyDevv/Horizon-Android
          ref: android
          path: source
          fetch-depth: 0
      - name: Replace main with source branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd source
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          git push --force origin HEAD:main
