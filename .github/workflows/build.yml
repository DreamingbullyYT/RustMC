name: Build
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: build-${{ github.ref }}, cancel-in-progress: true }
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - run: git diff --check HEAD~1 2>/dev/null || true
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14' }
      - name: Core checks
        run: gradle --no-daemon :core:check
      - name: Restore the signing key, if the repository has one
        env: { KEYSTORE_B64: '${{ secrets.FERRITE_KEYSTORE_BASE64 }}' }
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ferrite.jks"
            echo "FERRITE_KEYSTORE=$RUNNER_TEMP/ferrite.jks" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        env:
          FERRITE_KEYSTORE_PASSWORD: ${{ secrets.FERRITE_KEYSTORE_PASSWORD }}
          FERRITE_KEY_ALIAS: ${{ secrets.FERRITE_KEY_ALIAS }}
        run: gradle --no-daemon :app:assembleRelease -PversionCode=${{ github.run_number }}
      - name: Checksum
        run: |
          mkdir dist && cp app/build/outputs/apk/release/*.apk "dist/Ferrite-${{ github.run_number }}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - run: rm -f "$RUNNER_TEMP/ferrite.jks"
        if: always()
      - uses: actions/upload-artifact@v4
        with: { name: ferrite-${{ github.run_number }}, path: dist/, if-no-files-found: error, retention-days: 30 }
