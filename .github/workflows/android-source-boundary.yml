name: Android source boundary

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - "android-platform/**"
      - "tools/check_android_boundary.py"
      - ".github/workflows/android-source-boundary.yml"
  pull_request:
    paths:
      - "android-app/**"
      - "android-platform/**"
      - "tools/check_android_boundary.py"
      - ".github/workflows/android-source-boundary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Enforce upstream boundary
        run: python tools/check_android_boundary.py
