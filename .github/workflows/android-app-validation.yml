name: Android app validation

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - "android-storage/**"
      - "android-updater/**"
      - "android-instances/**"
      - "android-mods/**"
      - "android-controls/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-app-validation.yml"
  pull_request:
    paths:
      - "android-app/**"
      - "android-storage/**"
      - "android-updater/**"
      - "android-instances/**"
      - "android-mods/**"
      - "android-controls/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-app-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Assemble debug APK
        run: gradle --no-daemon :android-app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rustmc-android-debug
          path: android-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
