name: Android app validation

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - "android-storage/**"
      - "android-updater/**"
      - "android-instances/**"
      - "android-mods/**"
      - "android-runtime/**"
      - "android-game/**"
      - "android-base"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-app-validation.yml"
  pull_request:
    paths:
      - "android-app/**"
      - "android-storage/**"
      - "android-updater/**"
      - "android-instances/**"
      - "android-mods/**"
      - "android-runtime/**"
      - "android-game/**"
      - "android-base"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-app-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  NDK_VERSION: "26.3.11579264"
  RUST_TARGET: aarch64-linux-android

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            android-runtime/build/rust-target
          key: rust-${{ runner.os }}-${{ hashFiles('android-base/android/UPSTREAM_PIN', 'android-base/android/android.patch', 'android-base/core/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Assemble debug APK with native Horizon runtime
        run: gradle --no-daemon :android-app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rustmc-android-debug
          path: android-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
