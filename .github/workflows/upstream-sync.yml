name: Upstream sync

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and upstream submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update upstream and apply Android patches
        run: ./scripts/update-upstream.sh

      - name: Run repository tests
        run: python3 -m unittest discover -s tests -v

      - name: Verify exact upstream pin
        run: ./scripts/verify-upstream.sh

      - name: Commit upstream revision when changed
        shell: bash
        run: |
          if git diff --quiet -- UPSTREAM.lock upstream/horizon; then
            echo "No upstream changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UPSTREAM.lock upstream/horizon
          git commit -m "chore(upstream): sync Horizon main"
          git push
