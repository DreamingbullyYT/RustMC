name: Android source and upstream checks

on:
  push:
    branches: [horizon-android-port]
    paths:
      - 'android/**'
      - 'crates/**'
      - 'launcher/**'
      - 'packaging/android/**'
      - 'patches/**'
      - 'scripts/**'
      - 'tests/**'
      - 'UPSTREAM.lock'
      - '.github/workflows/android-upstream-check.yml'
  pull_request:
    branches: [horizon-android-port]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-upstream-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check patch formatting
        run: git diff --check
      - name: Test source import and pinned revision policy
        run: python3 -m unittest discover -s tests -p 'test_upstream_pin.py' -v
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.14'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android NDK and build tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
      - name: Install Rust and Android target
        run: |
          rustup toolchain install 1.95.0 --profile minimal --target aarch64-linux-android
          rustup default 1.95.0
      - name: Fetch exact upstream source for this build
        run: ./scripts/checkout-upstream.sh "$RUNNER_TEMP/horizon"
      - name: Overlay original Android application
        run: ./scripts/prepare-android-build.sh "$RUNNER_TEMP/horizon"
      - name: Verify Android clipboard dependency override
        run: cargo tree -p horizon-android --target aarch64-linux-android -i arboard
        working-directory: ${{ runner.temp }}/horizon
      - name: Compile Android native target
        run: |
          python3 "$RUNNER_TEMP/horizon/tools/android_build.py" \
            --abi arm64-v8a \
            --ndk-version 28.2.13676358 \
            --build-tools-version 35.0.0 \
            --check
      - name: Prepare Android engine assets
        run: python3 "$RUNNER_TEMP/horizon/tools/android_prepare.py" --java-home "$JAVA_HOME"
      - name: Build signed debug APK
        run: |
          python3 "$RUNNER_TEMP/horizon/tools/android_build.py" --abi arm64-v8a --public --profile fast \
            --sdk "$ANDROID_HOME" --java-home "${JAVA_HOME_17_X64:-$JAVA_HOME}" --gradle "$(command -v gradle)" \
            --ndk-version 28.2.13676358 --build-tools-version 35.0.0 \
            --dev-build "${GITHUB_RUN_NUMBER}.${GITHUB_SHA:0:12}" \
            --dev-version-code "$((1000 + GITHUB_RUN_NUMBER))"
      - name: Collect APK
        run: |
          mkdir -p dist
          cp "$RUNNER_TEMP/horizon/.local/android/apk/arm64-v8a/horizon-android-public.apk" \
            "dist/Horizon-Android-debug-arm64-v8a.apk"
          (cd dist && sha256sum Horizon-Android-debug-arm64-v8a.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: horizon-android-debug-arm64-v8a
          path: dist/
          if-no-files-found: error
          retention-days: 14
