name: Android packaging shell

on:
  push:
    branches: [android-minimal-port]
    paths:
      - "android/app/**"
      - ".github/workflows/android-shell.yml"
  pull_request:
    paths:
      - "android/app/**"
      - ".github/workflows/android-shell.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Assemble Android shell
        working-directory: android/app
        run: gradle assembleDebug
      - name: Locate generated APK
        run: |
          echo "APK files generated by Gradle:"
          find . -type f -name '*.apk' -print
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rustmc-android-shell
          path: '**/outputs/apk/debug/*.apk'
          if-no-files-found: error
